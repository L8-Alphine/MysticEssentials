# Gradle runtime options
# Enables the Gradle daemon for faster repeat builds.
org.gradle.daemon = true

# JVM memory used by Gradle while building the project.
org.gradle.jvmargs = -Xmx3G -XX:+UseG1GC

# Allows Gradle to build independent tasks in parallel.
org.gradle.parallel = true

# Enables Gradle's local build cache.
org.gradle.caching = true

# Java / Hytale options
# Java version used by the generated mod project.
java_version = 25

# Hytale server version targeted by this mod.
hytale_version = 0.6.8

# Optional path to a local Hytale installation, a directory containing Assets.zip, or an Assets.zip file.
# When set, runServer uses that Assets.zip instead of downloading one, and validateUiDocuments checks the
# shipped .ui documents against its Common.ui. Machine-specific: prefer setting it in
# ~/.gradle/gradle.properties rather than here.
# hytale_home = C:/Users/<you>/AppData/Roaming/Hytale/install/release/package/game/latest

# Mod identity
# Java package group used by Gradle.
group = org.hyzionstudios

# Group identifier written into manifest.json.
manifest_group = org.hyzionstudios

# Human-readable mod name.
mod_name = MysticEssentials

# Fully-qualified plugin entry point class.
main_class = org.hyzionstudios.mysticessentials.MysticessentialsPlugin

# Comma-separated author entries. Author names cannot contain spaces.
# Each entry supports: Name, Name|Email, or Name|Email|Url.
# Example: AzureDoom|azuredoom@example.com|https://example.com,SomeOtherAuthor
mod_author = Alphine

# Mod identifier written as the manifest Name. Must stay "MysticEssentials" (capital M and E): together
# with manifest_group it is the plugin identity (org.hyzionstudios:MysticEssentials) that names the data
# folder and that other mods depend on.
mod_id = MysticEssentials

# SPDX-style license identifier or Proprietary.
mod_license = Proprietary

# Short description written into manifest.json.
mod_description = MysticEssentials is a modular essentials system for Hytale servers designed around one goal: Essentials done right.

# Project website, source, or download URL.
mod_url = https://github.com/L8-Alphine/MysticEssentials

# Mod version.
version = 1.0.4

# Manifest / packaging options
# Whether this mod includes an asset pack.
includes_pack = true

# Injects hosted Hytale API docs into generated Vineflower server sources for easier IDE browsing.
inject_server_javadocs_into_sources = true

# Builds the hytale-assets.jar IDE binary from Assets.zip so vanilla assets can be browsed in the IDE.
generateAssetsBinary = true

# Whether this mod starts disabled by default.
disabled_by_default = false

# Hytale patchline used for dependency resolution.
patchline = release

# Server version mirrored for tooling compatibility.
server_version = 0.6.8

# Server version range written into manifest.json.
manifestServerVersion = >=0.6.8 <0.7.0

# Required manifest dependencies. Format: Group:Name=Version,Other:Mod=*
manifest_dependencies =

# Optional manifest dependencies. Same format as manifest_dependencies.
manifest_opt_dependencies = HelpChat:PlaceholderAPI=>=1.0.8,LuckPerms:LuckPerms=*,TheNewEconomy:VaultUnlocked=>=2.20.0,org.hyzionstudios:MysticVanish=>=1.0.0,org.hyzionstudios:mysticrpg=>=1.0.0,org.hyzionstudios:mysticidentity=*

# CurseForge project ID used by update checking, if any.
curseforgeID = 1600567